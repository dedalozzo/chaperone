<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="136" y1="72" x2="890" y2="970" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#233B66"/>
      <stop offset="0.48" stop-color="#172849"/>
      <stop offset="1" stop-color="#11192F"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0" cy="0" r="1" gradientTransform="matrix(524 428 -377 462 302 242)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5579C1" stop-opacity=".42"/>
      <stop offset="1" stop-color="#5579C1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="266" y1="226" x2="773" y2="836" gradientUnits="userSpaceOnUse">
      <stop stop-color="#83E8FF"/>
      <stop offset=".48" stop-color="#58B8F4"/>
      <stop offset="1" stop-color="#4770D9"/>
    </linearGradient>
    <linearGradient id="shieldFace" x1="365" y1="264" x2="661" y2="790" gradientUnits="userSpaceOnUse">
      <stop stop-color="#203961"/>
      <stop offset=".55" stop-color="#172A4B"/>
      <stop offset="1" stop-color="#1B2545"/>
    </linearGradient>
    <linearGradient id="route" x1="391" y1="465" x2="614" y2="734" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD88A"/>
      <stop offset=".42" stop-color="#83F0E5"/>
      <stop offset="1" stop-color="#70C9FF"/>
    </linearGradient>
    <linearGradient id="tile" x1="450" y1="662" x2="590" y2="815" gradientUnits="userSpaceOnUse">

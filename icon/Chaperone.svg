    <linearGradient id="tileSide" x1="512" y1="685" x2="590" y2="798" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6D8FF"/>
      <stop offset="1" stop-color="#79A9E8"/>
    </linearGradient>
    <linearGradient id="star" x1="462" y1="252" x2="565" y2="374" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7D8"/>
      <stop offset=".55" stop-color="#FFD77F"/>
      <stop offset="1" stop-color="#FFAD62"/>

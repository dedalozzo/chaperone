      <path d="M455 698c0-12 10-22 22-22h70v29c0 7-6 13-13 13h-79v-20Z" fill="#FFF" opacity=".78"/>
      <path d="m482 737 15 13-15 13M510 763h28" fill="none" stroke="#315785" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="550" cy="693" r="4" fill="#4D83B8" opacity=".7"/>
    </g>

  </g>

  <!-- Fine edge light gives the rounded-square icon a finished macOS feel. -->
  <path d="M220 8h584c119 0 212 93 212 212v584c0 119-93 212-212 212H220C101 1016 8 923 8 804V220C8 101 101 8 220 8Z" fill="none" stroke="#BDD9FF" stroke-opacity=".20" stroke-width="3"/>
